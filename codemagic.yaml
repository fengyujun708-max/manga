workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: linux_arm
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate code
        script: |
          cd packages/mangaverse_rust && cargo build --release 2>/dev/null || true
          flutter packages pub run build_runner build --delete-conflicting-outputs 2>/dev/null || true
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
      # Or use artifacts download link from UI