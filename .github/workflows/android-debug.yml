name: Android Debug Build

on:
  push:
    branches:
      - source-backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 释放空间
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android
          docker system prune -a -f
          sudo apt-get clean

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 生成签名密钥
        run: |
          mkdir -p android/app
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 9999 -keystore android/app/Breeze-key.keystore \
            -storepass android -keypass android \
            -dname "CN=MangaVerse,OU=Dev,O=MangaVerse,L=Shenzhen,ST=Guangdong,C=CN"
          echo "storeFile=Breeze-key.keystore" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties

      - name: 拉取 Flutter 依赖
        run: |
          fvm flutter pub get

      - name: Debug 构建 (arm64 + x64)
        run: |
          fvm flutter build apk --debug --target-platform=android-arm64,android-x64

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7