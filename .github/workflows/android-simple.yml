name: Android Simple Build

on:
  push:
    branches:
      - source-backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: 生成签名密钥
        run: |
          mkdir -p android/app
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 9999 -keystore android/app/Breeze-key.keystore \
            -storepass android -keypass android \
            -dname "CN=MangaVerse,OU=Dev,O=MangaVerse,L=Shenzhen,ST=Guangdong,C=CN"
          echo "storeFile=Breeze-key.keystore" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties

      - name: 验证 Flutter 环境
        run: |
          flutter doctor -v

      - name: 获取依赖
        run: |
          flutter pub get

      - name: 分析代码
        run: |
          flutter analyze --no-fatal-infos

      - name: Debug 构建 (仅 arm64)
        run: |
          flutter build apk --debug --target-platform=android-arm64

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-debug-arm64
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7