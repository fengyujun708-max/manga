name: Android Simple Build

on:
  push:
    branches:
      - source-backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 安装 Android NDK
        run: |
          yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 安装 Android CMake
        run: |
          yes | sdkmanager "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}" >> $GITHUB_ENV

      - name: 接受 Android Licenses
        run: |
          yes | sdkmanager --licenses

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 生成签名密钥
        run: |
          mkdir -p android/app
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 9999 -keystore android/app/Breeze-key.keystore \
            -storepass android -keypass android \
            -dname "CN=Mangaverse,OU=Dev,O=Mangaverse,L=Shenzhen,ST=Guangdong,C=CN"
          echo "storeFile=Breeze-key.keystore" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties

      - name: 验证 Flutter 环境
        run: |
          fvm flutter doctor -v

      - name: 获取依赖 (verbose)
        run: |
          fvm flutter pub get --verbose

      - name: 运行代码生成
        run: |
          fvm flutter pub run build_runner build --delete-conflicting-outputs

      - name: Debug 构建 (仅 arm64) - 输出详细日志
        run: |
          fvm flutter build apk --debug --target-platform=android-arm64 -v 2>&1 | tee build.log

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-debug-arm64
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7