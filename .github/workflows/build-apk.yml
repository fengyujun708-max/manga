name: 自动构建 APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: 生成 Android 平台目录
        run: flutter create --platforms=android --org com.manjie --project-name manjie .

      - name: 配置网络安全（允许 HTTP 明文流量到服务器 IP）
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">39.106.192.137</domain>
              </domain-config>
          </network-security-config>
          EOF
          # 在 AndroidManifest.xml 的 application 标签添加 networkSecurityConfig
          sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" /' android/app/src/main/AndroidManifest.xml

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: manjie-release-apks
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 上传统一 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manjie-universal-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30