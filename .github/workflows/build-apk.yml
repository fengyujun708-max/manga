name: 自动构建 APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: 生成 Android 平台目录
        run: flutter create --platforms=android --org com.manjie --project-name manjie .

      # ★★★ 直接写入正确配置（不依赖 repo 备份，绝对可靠）★★★
      - name: 注入网络配置（HTTP 明文流量）
        run: |
          # 1. 覆盖 AndroidManifest.xml（flutter create 生成的是默认版，无网络权限）
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.manjie.manjie">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:name="io.flutter.app.FlutterApplication"
                  android:label="漫界"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFEST

          # 2. 写入 network_security_config.xml（允许 HTTP 明文 + 信任服务器）
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'NSC'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                      <certificates src="user"/>
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">39.106.192.137</domain>
              </domain-config>
          </network-security-config>
          NSC

      - name: 验证配置
        run: |
          echo "=== AndroidManifest.xml 关键行 ==="
          grep "usesCleartextTraffic\|networkSecurityConfig" android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== network_security_config.xml 存在 ==="
          ls -la android/app/src/main/res/xml/
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: manjie-release-apks
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 上传统一 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manjie-universal-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30