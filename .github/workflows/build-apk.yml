name: 自动构建 APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: 生成 Android 平台目录
        run: flutter create --platforms=android --org com.manjie --project-name manjie .

      # ★ 用 manifestPlaceholders（Android 官方机制）强制注入，merger 一定保留
      - name: 注入 HTTP 明文权限
        run: |
          # 1. 在 manifest 的 <application 标签注入 2 个属性（用 placeholder）
          python3 -c "
          content = open('android/app/src/main/AndroidManifest.xml', 'r', encoding='utf-8').read()
          if 'usesCleartextTraffic' not in content:
              content = content.replace('<application', '<application\n        android:usesCleartextTraffic=\"\${usesCleartextTraffic}\"\n        android:networkSecurityConfig=\"@xml/network_security_config\"', 1)
          open('android/app/src/main/AndroidManifest.xml', 'w', encoding='utf-8').write(content)
          print('manifest 注入完成')
          "
          # 2. 在 app/build.gradle(.kts) 的 defaultConfig 里设置 manifestPlaceholders
          python3 -c "
          import glob
          # 兼容 build.gradle（Groovy）和 build.gradle.kts（Kotlin DSL）
          gradle_file = None
          for p in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              try:
                  open(p, 'r', encoding='utf-8').read()
                  gradle_file = p
                  break
              except FileNotFoundError:
                  continue
          if gradle_file is None:
              raise Exception('找不到 build.gradle 或 build.gradle.kts')
          print(f'找到 gradle 文件: {gradle_file}')
          gradle = open(gradle_file, 'r', encoding='utf-8').read()
          if 'manifestPlaceholders' not in gradle:
              if gradle_file.endswith('.kts'):
                  # Kotlin DSL 语法
                  gradle = gradle.replace('versionName = flutterVersionName', 'versionName = flutterVersionName\n        manifestPlaceholders[\"usesCleartextTraffic\"] = \"true\"', 1)
              else:
                  # Groovy DSL 语法
                  gradle = gradle.replace('versionName = flutterVersionName', 'versionName = flutterVersionName\n        manifestPlaceholders = [usesCleartextTraffic: \"true\"]', 1)
          open(gradle_file, 'w', encoding='utf-8').write(gradle)
          print('build.gradle 注入完成')
          "
          # 3. 写入 network_security_config.xml
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'NSC'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system"/>
                      <certificates src="user"/>
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">39.106.192.137</domain>
              </domain-config>
          </network-security-config>
          NSC

      - name: 验证配置
        run: |
          echo "=== manifest 网络配置 ==="
          grep "usesCleartextTraffic\|networkSecurityConfig\|applicationName" android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== build.gradle placeholder ==="
          grep "manifestPlaceholders\|usesCleartextTraffic" android/app/build.gradle* 2>/dev/null || echo "(gradle 文件查找方式见下)"
          grep -r "usesCleartextTraffic" android/app/*.gradle* 2>/dev/null || true
          echo ""
          echo "=== nsc 文件 ==="
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: manjie-release-apks
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 上传统一 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manjie-universal-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30