name: 自动构建 APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: 生成 Android 平台目录
        run: |
          # 备份 repo 中的正确配置
          cp android/app/src/main/AndroidManifest.xml /tmp/manifest.xml
          cp android/app/src/main/res/xml/network_security_config.xml /tmp/nsc.xml
          # flutter create 会覆盖 gradle 文件（但不覆盖 src/main/AndroidManifest.xml）
          flutter create --platforms=android --org com.manjie --project-name manjie .
          # 恢复正确的配置
          cp /tmp/manifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp /tmp/nsc.xml android/app/src/main/res/xml/network_security_config.xml
          echo "配置已恢复"

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: manjie-release-apks
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 上传统一 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manjie-universal-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30