name: 自动构建 APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze

      - name: 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: manjie-release-apks
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 上传统一 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manjie-universal-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30