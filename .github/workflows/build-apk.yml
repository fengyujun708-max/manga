name: 自动构建 APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: 生成 Android 平台目录
        run: |
          # ★ 关键：flutter create 会覆盖 android/ 目录里的所有文件
          # 所以先备份正确的网络配置，创建完后恢复
          mkdir -p /tmp/android_backup
          cp -r android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          cp -r android/app/src/main/res/xml/ /tmp/android_backup/
          # flutter create 会生成 gradle files + 默认 manifest
          flutter create --platforms=android --org com.manjie --project-name manjie .
          # 立即恢复正确的网络配置
          cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp /tmp/android_backup/xml/network_security_config.xml android/app/src/main/res/xml/ 2>/dev/null || true
          # ★ 验证恢复成功
          echo "=== AndroidManifest.xml 验证 ==="
          grep "usesCleartextTraffic\|networkSecurityConfig" android/app/src/main/AndroidManifest.xml
          echo "=== network_security_config.xml 验证 ==="
          ls -la android/app/src/main/res/xml/
          echo "=== 内容 ==="
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze --no-fatal-warnings || true

      - name: 构建 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: manjie-release-apks
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 上传统一 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manjie-universal-apk
          path: client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30