name: 漫界 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.29.0'

jobs:
  # ====== 后端测试 ======
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 单元测试
        run: npm test || true

  # ====== 前端分析 ======
  frontend-analyze:
    name: 前端代码分析
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 安装依赖
        run: flutter pub get

      - name: 代码分析
        run: flutter analyze || true

  # ====== Docker 构建 ======
  docker-build:
    name: Docker 构建
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-analyze]

    steps:
      - uses: actions/checkout@v4

      - name: 构建 API 镜像
        run: docker build -t manjie-api:latest apps/api/

      - name: 构建 Admin 镜像
        run: docker build -t manjie-admin:latest apps/admin/