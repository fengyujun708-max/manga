name: Android Build Only

on:
  push:
    branches:
      - source-backup
  workflow_dispatch:

permissions:
  contents: read

env:
  MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ secrets.BREEZE_PLUGIN_GITHUB_TOKEN != '' &&
    secrets.BREEZE_PLUGIN_GITHUB_TOKEN || github.token }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 释放空间 (Nuclear Mode)
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android
          docker system prune -a -f
          sudo apt-get clean

      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: 生成签名密钥 (CI)
        run: |
          mkdir -p android/app
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 9999 -keystore android/app/Breeze-key.keystore \
            -storepass android -keypass android \
            -dname "CN=MangaVerse,OU=Dev,O=MangaVerse,L=Shenzhen,ST=Guangdong,C=CN"
          echo "storeFile=Breeze-key.keystore" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: |
          yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 安装 Android CMake
        run: |
          yes | sdkmanager "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}" >> $GITHUB_ENV

      - name: 接受 Android Licenses
        run: |
          yes | sdkmanager --licenses

      - name: 拉取 Flutter 依赖
        run: |
          fvm flutter pub get

      - name: 缓存 ncnn 源码
        uses: actions/cache@v4
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/build_ncnn_static_android.py') }}

      - name: 缓存 RealSR-NCNN-Android 源码
        uses: actions/cache@v4
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/build_waifu2x_cli_android.py') }}

      - name: 准备 Android waifu2x CLI 依赖
        run: |
          python3 script/prepare_android_waifu2x_deps.py

      - name: 编译 Android 静态 ncnn
        run: |
          python3 script/build_ncnn_static_android.py

      - name: 编译 Android waifu2x CLI
        run: |
          python3 script/build_waifu2x_cli_android.py

      - name: 运行 Android 构建脚本
        run: |
          fvm dart ./script/build_apk.dart

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v6
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 7
