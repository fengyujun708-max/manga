name: manjie
description: 漫界 - 漫画阅读平台
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 路由
  go_router: ^14.0.0

  # 状态管理
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0

  # 网络
  dio: ^5.4.0
  html: ^0.15.4
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  flutter_qjs:
    git:
      url: https://github.com/venera-app/flutter_qjs
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4
  enough_convert: ^1.5.0
  path: ^1.9.0
  uuid: ^4.5.1
  mime: ^2.0.0
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.30
  url_launcher: ^6.3.1
  share_plus: 11.1.0
  file_selector: ^1.0.0
  flutter_file_dialog: ^3.0.0
  flutter_saf: ^0.5.0
  webdav_client: ^1.2.0
  zip_flutter: ^0.0.13
  lodepng_flutter:
    git:
      url: https://github.com/venera-app/lodepng_flutter
      ref: ac7d05dde32e8d728102a9ff66e6b55f05d94ba1
      path: .
  http: ^1.2.0

  # 本地存储
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # 工具
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  path_provider: ^2.1.0

  # JS 引擎（Venera 源本地执行，网络走手机）
  flutter_js: ^0.8.7

  # 平台
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/venera_client_runtime.js
    - assets/vcomic_engine.js
    - assets/sources/
    #- assets/sources/*.js.enc  # dart 不支持 glob，用目录