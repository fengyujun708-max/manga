name: manjie
description: 漫界 - 漫画阅读平台
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 路由
  go_router: ^14.0.0

  # 状态管理
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0

  # 网络
  dio: ^5.4.0
  retrofit: ^4.1.0
  web_socket_channel: ^3.0.0

  # 本地存储
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # 模型
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0
  photo_view: ^0.15.0
  flutter_animate: ^4.5.0

  # 工具
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.0
  dartz: ^0.10.0
  get_it: ^8.0.0
  injectable: ^2.4.0
  path_provider: ^2.1.0
  url_launcher: ^6.2.0

  # 平台
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  injectable_generator: ^2.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/i18n/