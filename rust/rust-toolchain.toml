[toolchain]
channel = "1.93.0"
profile = "default"

# [BUILD FIX] Trimmed to Android-only targets. The original file listed
# iOS/macOS/Windows/Linux targets; `rustup show` auto-installs every target
# in this list, which triggered downloads of non-Android rust-std components
# (blocked network) during the Android APK build. Android builds only need
# the four Android ABIs below, all already installed on the build host.
targets = [
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "i686-linux-android",
]
